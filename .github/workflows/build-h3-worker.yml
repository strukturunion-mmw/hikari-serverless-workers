name: build-h3-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "h3/**"
      - ".github/workflows/build-h3-worker.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hikari-h3-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (the 13 GB base image does not fit a stock runner)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/share/powershell \
                      /opt/microsoft /usr/lib/mono 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: h3
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
